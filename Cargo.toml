[package]
name = "vega"
version = "2.2.0"
edition = "2024"

[dependencies]
colored = "3.1.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["network", "system"] }
libc = { version = "1.0.0-alpha.4", default-features = false }
pci-info = { version = "0.4.0", default-features = false }
pci-ids = { version = "0.2.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", default-features = false }


[build-dependencies]
anyhow = { version = "1.0.104", default-features = false }
