[package]
name = "vega"
version = "2.2.1"
edition = "2024"

[dependencies]
colored = "3.1.1"
libc = { version = "1.0.0-alpha.4", default-features = false }
pci-ids = { version = "0.2.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", default-features = false }
core-foundation = "0.10.1"

[build-dependencies]
anyhow = { version = "1.0.104", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
